name: Deploy Showcase to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'showcase/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Showcase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: showcase/package-lock.json

      - name: Install Showcase Dependencies
        run: |
          cd showcase
          npm ci

      - name: Build Showcase for GitHub Pages
        run: |
          cd showcase
          npm run build
        env:
          VITE_BASE_PATH: /AuthORS/

      - name: Setup 404 for SPA Routing
        run: |
          cp showcase/dist/index.html showcase/dist/404.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: showcase/dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
